<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout — Markhor Accessories</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>Markhor Accessories</h1>
    <nav>
      <a href="/index.html">Home</a>
      <a href="/products.html">Products</a>
      <a href="/cart.html">Cart</a>
    </nav>
  </header>

  <main>
    <h2>Checkout</h2>
    <form id="checkout-form">
      <label>Name: <input name="name" required /></label>
      <label>Phone: <input name="phone" required /></label>
      <label>WhatsApp: <input name="whatsapp" required /></label>
      <label>City: <input name="city" required /></label>
      <label>Address: <textarea name="address" required></textarea></label>
      <label>Notes: <textarea name="notes"></textarea></label>
      <button type="submit" class="btn">Place Order (COD)</button>
    </form>
    <div id="success" style="display:none; margin-top:1rem;">
      <h3>Order Placed!</h3>
      <p>Confirm your order on WhatsApp:</p>
      <a id="wa-link" class="btn" target="_blank" rel="noopener">Confirm on WhatsApp</a>
    </div>
  </main>

  <footer><p>© 2026 Markhor Accessories</p></footer>

  <script src="/js/checkout.js"></script>
</body>
</html>
